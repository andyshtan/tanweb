<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathematical Resonance</title>
    <!-- Interlocking rings representing Hopf Fibration topology -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='40' cy='50' r='30' fill='none' stroke='%2338bdf8' stroke-width='8'/><circle cx='60' cy='50' r='30' fill='none' stroke='%23c084fc' stroke-width='8'/></svg>">
    
    <!-- Three.js required for Hopf Fibration -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <style>
        /* --- GLOBAL STYLES --- */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000; /* Pure deep black */
        }

        #tan-app, #cool-app {
            display: none; /* Hidden by default, JS will reveal one */
            width: 100%;
            height: 100%;
            background-color: #000000;
        }

        /* --- TAN.ID STYLES (HOPF FIBRATION) --- */
        #tan-app {
            background: radial-gradient(circle at center, #111b2b 0%, #000000 100%);
        }

        /* --- COOL.ID STYLES (SUN & PLANETS) --- */
        #cool-app {
            justify-content: center;
            align-items: center;
        }
        #cool-app svg {
            width: 90vmin;
            height: 90vmin;
        }
        .orbit {
            fill: none;
            stroke: rgba(255, 255, 255, 0.2);
            stroke-width: 1;
            stroke-dasharray: 4 4;
        }
        .sun {
            filter: drop-shadow(0 0 30px #FF8C00);
        }
        .planet {
            animation: orbit linear infinite;
        }
        @keyframes orbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .p1 { animation-duration: 4s; }
        .p2 { animation-duration: 7s; }
        .p3 { animation-duration: 12s; }
        .p4 { animation-duration: 20s; }
    </style>
</head>
<body>

    <!-- TAN.ID: HOPF FIBRATION -->
    <div id="tan-app">
        <div id="tan-app-container" style="width: 100%; height: 100%;"></div>
    </div>

    <!-- COOL.ID: SUN & PLANETS -->
    <div id="cool-app">
        <svg viewBox="0 0 1000 1000">
            <defs>
                <radialGradient id="sun-grad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                    <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
                    <stop offset="20%" style="stop-color:#FFF5A5;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#FF4500;stop-opacity:0.9" />
                </radialGradient>
                <radialGradient id="p1-grad" cx="30%" cy="30%" r="70%">
                    <stop offset="0%" stop-color="#dddddd"/><stop offset="100%" stop-color="#444444"/>
                </radialGradient>
                <radialGradient id="p2-grad" cx="30%" cy="30%" r="70%">
                    <stop offset="0%" stop-color="#ffcc99"/><stop offset="100%" stop-color="#995522"/>
                </radialGradient>
                <radialGradient id="p3-grad" cx="30%" cy="30%" r="70%">
                    <stop offset="0%" stop-color="#aaddff"/><stop offset="100%" stop-color="#0044aa"/>
                </radialGradient>
                <radialGradient id="p4-grad" cx="30%" cy="30%" r="70%">
                    <stop offset="0%" stop-color="#ff8888"/><stop offset="100%" stop-color="#aa0000"/>
                </radialGradient>
            </defs>

            <!-- Orbits -->
            <circle class="orbit" cx="500" cy="500" r="100" />
            <circle class="orbit" cx="500" cy="500" r="180" />
            <circle class="orbit" cx="500" cy="500" r="280" />
            <circle class="orbit" cx="500" cy="500" r="400" />

            <!-- Sun -->
            <circle class="sun" cx="500" cy="500" r="55" fill="url(#sun-grad)" />

            <!-- Planet 1 -->
            <g class="planet p1" style="transform-origin: 500px 500px;">
                <circle cx="500" cy="400" r="12" fill="url(#p1-grad)" />
            </g>
            
            <!-- Planet 2 -->
            <g class="planet p2" style="transform-origin: 500px 500px;">
                <circle cx="500" cy="320" r="20" fill="url(#p2-grad)" />
                <ellipse cx="500" cy="320" rx="35" ry="10" fill="none" stroke="rgba(255,200,150,0.5)" stroke-width="3" transform="rotate(20 500 320)" />
            </g>

            <!-- Planet 3 -->
            <g class="planet p3" style="transform-origin: 500px 500px;">
                <circle cx="500" cy="220" r="25" fill="url(#p3-grad)" />
                <g style="animation: orbit 2s linear infinite; transform-origin: 500px 220px;">
                    <circle cx="500" cy="175" r="5" fill="#ffffff" />
                </g>
            </g>

            <!-- Planet 4 -->
            <g class="planet p4" style="transform-origin: 500px 500px;">
                <circle cx="500" cy="100" r="18" fill="url(#p4-grad)" />
                <g style="animation: orbit 3s linear infinite; transform-origin: 500px 100px;">
                    <circle cx="500" cy="65" r="3" fill="#dddddd" />
                </g>
                <g style="animation: orbit 5s linear infinite reverse; transform-origin: 500px 100px;">
                    <circle cx="500" cy="50" r="4" fill="#aaaaaa" />
                </g>
            </g>
        </svg>
    </div>

    <script>
        const isCoolId = window.location.hostname.includes('cool.id');

        if (isCoolId) {
            // --- INITIALIZE COOL.ID (SUN & PLANETS) ---
            document.title = "Star System";
            document.getElementById('cool-app').style.display = 'flex';
            document.querySelector("link[rel*='icon']").href = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23FFA500'/></svg>";
        } else {
            // --- INITIALIZE TAN.ID (HOPF FIBRATION) ---
            document.title = "Hopf Fibration";
            document.getElementById('tan-app').style.display = 'block';
            
            const container = document.getElementById('tan-app-container');
            const scene = new THREE.Scene();

            const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 4, 12);

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 1.5;

            const group = new THREE.Group();
            scene.add(group);

            function stereographic(x1, x2, x3, x4) {
                const div = 1.0 - x4 + 0.00001; 
                return new THREE.Vector3(x1 / div, x2 / div, x3 / div);
            }

            const numLatitudes = 20;
            const numLongitudes = 45;
            const pointsPerFiber = 120;

            for (let i = 1; i < numLatitudes; i++) {
                const theta = (i / numLatitudes) * Math.PI; 
                for (let j = 0; j < numLongitudes; j++) {
                    const phi = (j / numLongitudes) * Math.PI * 2; 
                    const points = [];
                    for (let k = 0; k <= pointsPerFiber; k++) {
                        const xi = (k / pointsPerFiber) * Math.PI * 2; 
                        const x1 = Math.sin(theta / 2) * Math.cos(xi);
                        const x2 = Math.sin(theta / 2) * Math.sin(xi);
                        const x3 = Math.cos(theta / 2) * Math.cos(xi + phi);
                        const x4 = Math.cos(theta / 2) * Math.sin(xi + phi);
                        points.push(stereographic(x1, x2, x3, x4));
                    }
                    const geometry = new THREE.BufferGeometry().setFromPoints(points);
                    const hue = (phi / (Math.PI * 2));
                    const lightness = 0.4 + 0.4 * Math.sin(theta);
                    const material = new THREE.LineBasicMaterial({
                        color: new THREE.Color().setHSL(hue, 1.0, lightness),
                        transparent: true,
                        opacity: 0.25,
                        blending: THREE.AdditiveBlending,
                        depthWrite: false,
                        linewidth: 1
                    });
                    const line = new THREE.Line(geometry, material);
                    group.add(line);
                }
            }

            const coreGeo = new THREE.SphereGeometry(0.5, 32, 32);
            const coreMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.05, blending: THREE.AdditiveBlending });
            const core = new THREE.Mesh(coreGeo, coreMat);
            group.add(core);

            let time = 0;
            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                time += 0.01;
                const scale = 1.0 + 0.02 * Math.sin(time);
                group.scale.set(scale, scale, scale);
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
    </script>
</body>
</html>
